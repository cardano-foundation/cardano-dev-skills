- name: Yaci Store
  repo: https://github.com/bloxbean/yaci-store.git
  # store.yaci.xyz is a Next.js App Router site inside this repo: pages are
  # `page.mdx` under docs/app/docs/<version>/, so a `docs/**/*.md` glob matches
  # none of it. Pinned to v2 deliberately — v1 is the legacy tree and vendoring
  # both leaves an agent unable to tell current API guidance from superseded.
  docs_path: docs/app/docs/v2
  format: mdx
  category: infrastructure
  priority: medium
  glob_patterns:
    - "**/*.mdx"
  description: Modular Java indexer with Blockfrost-compatible APIs
  website: https://store.yaci.xyz

- name: Masumi
  repo: https://github.com/masumi-network/masumi-docs.git
  docs_path: content/docs
  format: mdx
  category: infrastructure
  priority: medium
  glob_patterns:
    # glob_patterns is include-only, so the two directories holding excluded
    # files are enumerated per file; new pages added to either one upstream
    # need a line here. Excluded:
    #   core-concepts/{blockchain,tokens,transaction-fees,utxo,wallets}.mdx
    #     — generic Cardano-101 already covered by Cardano Docs, the
    #       Developer Portal and the CIPs
    #   documentation/how-to-guides/hosting-guide.mdx
    #     — VPS install that pipes deb.nodesource.com to a shell
    - "api-reference/**/*.mdx"
    - "mips/**/*.mdx"
    - "n8n-node/**/*.mdx"
    - "core-concepts/index.mdx"
    - "core-concepts/agent-to-agent-payments.mdx"
    - "core-concepts/agentic-service.mdx"
    - "core-concepts/decision-logging.mdx"
    - "core-concepts/environments.mdx"
    - "core-concepts/identity.mdx"
    - "core-concepts/payments.mdx"
    - "core-concepts/refunds-and-disputes.mdx"
    - "core-concepts/registry.mdx"
    - "core-concepts/regulatory-compliance.mdx"
    - "core-concepts/smart-contracts.mdx"
    - "documentation/*.mdx"
    - "documentation/get-started/**/*.mdx"
    - "documentation/integrations/**/*.mdx"
    - "documentation/technical-documentation/**/*.mdx"
    - "documentation/how-to-guides/configure-agent-pricing.mdx"
    - "documentation/how-to-guides/how-to-enable-agent-collaboration.mdx"
    - "documentation/how-to-guides/human-in-the-loop.mdx"
    - "documentation/how-to-guides/list-agent-on-sokosumi.mdx"
    - "documentation/how-to-guides/top-up-your-wallets.mdx"
    - "documentation/how-to-guides/troubleshoot-blockchain-errors.mdx"
  description: Self-hosted payment and registry node for AI agent services — escrowed agent-to-agent payments, on-chain identity, agent registry, and the MIP-003 agentic service API
  website: https://www.masumi.network/dev

