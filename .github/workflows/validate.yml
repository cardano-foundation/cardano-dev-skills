name: Validate Skills & Sources

on:
  pull_request:
    paths:
      # docs/** is included for the Windows path-portability check: an
      # upstream doc named with a character Windows rejects breaks `git
      # clone` for every Windows user (issue #36).
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"
      # hooks/** runs on every user's machine at SessionStart, and had no gate
      # at all until its tests landed: PRs touching only hooks/ reported zero
      # checks.
      - "hooks/**"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"
      # hooks/** runs on every user's machine at SessionStart, and had no gate
      # at all until its tests landed: PRs touching only hooks/ reported zero
      # checks.
      - "hooks/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `--paths-only` promises to run on a bare python3 with no dependencies
      # installed, which is what the weekly refresh gates on. That promise was
      # only ever a comment: CI runs 3.12, where a PEP-604 annotation is legal,
      # so nothing noticed when one was added — while macOS ships 3.9, where it
      # takes the whole module down at import before argparse sees the flag.
      # Pin the oldest interpreter the promise covers, and it stops being a
      # promise anyone can break silently.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: "--paths-only runs on a bare interpreter"
        run: python scripts/validate.py --paths-only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills and sources
        run: python scripts/validate.py

      # Runs in the existing job on purpose — it needs no Python, no network and
      # under a second, so it does not warrant a fourth workflow.
      - name: Test SessionStart hook
        run: ./hooks/test-check-docs.sh
