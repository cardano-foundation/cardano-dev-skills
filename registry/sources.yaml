  docs_path: "."
  format: markdown
  category: infrastructure
  priority: high
  glob_patterns:
    - README.md
    - changelog.md
  description: Shared Nix overlays for IOG/Intersect Cardano Haskell builds — libsodium-vrf, secp256k1, libblst, haskell.nix crypto helpers. Required to compile cardano-crypto-class and friends.

# Go doc comments sit directly above the identifiers they describe, so mirroring
# `.go` source gives agents the API reference (same rationale as `format: python`
# for docstrings). `internal/` is excluded from every Go source below: the Go
# compiler forbids importing it, so it is not an integration surface.
- name: gOuroboros
  repo: https://github.com/blinklabs-io/gouroboros.git
  docs_path: "."
  format: go
  category: infrastructure
  priority: medium
  glob_patterns:
    - README.md
    - ARCHITECTURE.md
    - DEVELOPMENT.md
    - "protocol/**/*.md"
    - consensus/README.md
    - kes/README.md
    - vrf/README.md
    - "*.go"
    - "ledger/*.go"
    - "ledger/common/**/*.go"
    - "examples/**/*.go"
  description: Go building blocks for Ouroboros/Cardano protocols - mini-protocol implementations, ledger types, CBOR codecs
  website: https://pkg.go.dev/github.com/blinklabs-io/gouroboros

