name: Validate Skills & Sources

on:
  pull_request:
    paths:
      # docs/** is included for the Windows path-portability check: an
      # upstream doc named with a character Windows rejects breaks `git
      # clone` for every Windows user (issue #36).
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills and sources
        run: python scripts/validate.py
