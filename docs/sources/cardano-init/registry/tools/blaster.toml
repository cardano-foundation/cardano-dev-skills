[tool]
id = "blaster"
name = "Blaster"
description = """\
A placeholder formal-methods tool for Cardano protocol projects. \
Blaster provides a specification language and automated verification \
engine for proving properties of on-chain validators."""
website = "https://example.com/blaster"
languages = ["blaster-spec"]
system_deps = []
nix_packages = []
detect = ["spec/example.spec"]
# Experimental on both counts: Blaster itself is a work-in-progress upstream
# tool (unstable, pre-release), and its cardano-init integration is not yet
# build-green.
experimental = true

[roles.formal-methods]
template = "blaster/formal-methods"
