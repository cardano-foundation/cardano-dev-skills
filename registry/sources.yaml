- name: Cardano Connect with Wallet
  repo: https://github.com/cardano-foundation/cardano-connect-with-wallet.git
  docs_path: "."
  format: markdown
  category: sdk
  priority: high
  # This repo has no docs/ tree and no packages/ dir: the documentation is the
  # per-package READMEs (core/, react/, html/) alongside the root one. Both
  # previous tree globs matched nothing. Scoped one level deep on purpose — a
  # recursive `**/README.md` also pulls in vendored dependency READMEs such as
  # html/highlight/README.md, which documents Highlight.js, not this library.
  glob_patterns:
    - README.md
    - "*/README.md"
  description: Official Cardano Foundation library + React hooks for CIP-30 wallet integration in web dApps

