type: array
items:
  type: object
  properties:
    tx_hash:
      type: string
      description: Hash of the voting transaction.
    cert_index:
      type: integer
      description: Index of the certificate within the voting transaction.
    voter_role:
      type: string
      enum: [constitutional_committee, drep, spo]
      description: The role of the voter. Can be one of constitutional_committee, drep, spo.
    voter:
      type: string
      description: >-
        The actual voter. CIP-129 Bech32 identifier: `drep1...`, `pool1...` or `cc_hot1...`.
    vote:
      type: string
      enum: [yes, no, abstain]
      description: The Vote. Can be one of yes, no, abstain.
    counted:
      type: boolean
      description: >-
        Whether the vote counts toward the proposal's tally. Only the voter's
        latest vote counts, and a DRep vote stops counting if the DRep
        deregisters while the proposal is still live.

  required:
    - tx_hash
    - cert_index
    - voter_role
    - voter
    - vote
    - counted
example:
  - tx_hash: "144a086c58a7b7324fba98be44a9c1560f78970ec777ede701d097936591aa4b"
    cert_index: 0
    voter_role: "drep"
    voter: drep1mvdu8slennngja7w4un6knwezufra70887zuxpprd64jxfveahn
    vote: "no"
    counted: false
  - tx_hash: "b302de601defdf11a5261ed31a263804dac4a582a888c998ce24dec5"
    cert_index: 2
    voter_role: "drep"
    voter: drep1mvdu8slennngja7w4un6knwezufra70887zuxpprd64jxfveahn
    vote: "yes"
    counted: true
  - tx_hash: "b302de601defdf11a5261ed31a263804dac4a582a888c998ce24dec5"
    cert_index: 3
    voter_role: "constitutional_committee"
    voter: "cc_hot1q0wzkpcxzzfs4mf4yk6yx7d075vqtyx2tnxsr256he6gnwq6yfy5w"
    vote: "abstain"
    counted: true
