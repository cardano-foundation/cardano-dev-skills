# haskell.nix is IOG Haskell/Nix infra, not a Cardano protocol. It is
# registered because it is the documented Nix consumer of CHaP (see the
# CHaP README) and every Intersect/CF Haskell repo is a haskell.nix flake.
# Flagged against the Cardano-native source test in issue #45.
- name: haskell.nix
  repo: https://github.com/input-output-hk/haskell.nix.git
  docs_path: docs
  format: markdown
  category: infrastructure
  priority: high
  glob_patterns:
    - "*.md"
    - "tutorials/**/*.md"
    - "template/**/*.md"
    - "reference/**/*.md"
  description: Nix infrastructure for Cabal/Haskell projects — flakes, inputMap for extra package indexes (CHaP), source-repository-package hashes. The Nix frontend used by Intersect Cardano Haskell repos.
  website: https://input-output-hk.github.io/haskell.nix

- name: iohk-nix
