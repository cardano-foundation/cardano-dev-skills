  category: smart-contracts
  priority: medium
  glob_patterns:
    - README.md
    - "docs/substandards/**/*.md"
    - "src/substandards/**/README.md"
    - "src/substandards/**/validators/*.ak"
    - "src/substandards/**/lib/**/*.ak"
    - src/programmable-tokens-offchain-java/KYC-SUBSTANDARD.md
  description: Off-chain reference platform for CIP-113 — substandard Aiken validators (KYC, KYC-extended, freeze-and-seize, dummy) and markdown explainers for the KERI / CIP-170 attestation flow. Status R&D.

