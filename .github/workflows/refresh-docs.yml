name: Refresh Documentation Sources

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Fetch all documentation sources (branch tips, update pins)
        run: |
          ./scripts/fetch-docs.sh --update-pins \
            --manifest-out /tmp/refresh-manifest.json

      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain docs/sources/ registry/pins.yaml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes detected"
          fi

      - name: Create per-source commits
        if: steps.changes.outputs.changed == 'true'
        id: commits
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          BRANCH="docs/refresh-$(date +%Y-%m-%d)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/_commit_refresh.py \
            --manifest /tmp/refresh-manifest.json \
            --summary-out /tmp/refresh-summary.md

      - name: Security scan of the delta (report for the PR body)
        if: steps.changes.outputs.changed == 'true'
        # Report only — the PR Policy workflow re-runs this scan on the PR as
        # the blocking check. Never let a scan error abort the refresh: the
        # report is best-effort context, always leaving a file behind.
        run: |
          python3 scripts/scan-docs-delta.py \
            --base "${{ steps.commits.outputs.base_sha }}" --head HEAD \
            --output-md /tmp/scan-report.md \
            || echo "_(scan report unavailable — the PR Policy check is authoritative)_" > /tmp/scan-report.md

      - name: Assemble PR body
        if: steps.changes.outputs.changed == 'true'
        # Build the body BEFORE pushing, so a missing input fails here (no
        # branch pushed yet) rather than after the push leaves an orphan.
        run: |
          {
            echo "## Automated Documentation Refresh"
            echo
            echo "One commit per changed source — a bad upstream delta can be"
            echo "reverted per source with \`git revert <commit>\`."
            echo
            echo "### Sources updated"
            echo
            cat /tmp/refresh-summary.md 2>/dev/null || echo "(summary unavailable)"
            echo
            cat /tmp/scan-report.md 2>/dev/null || echo "(scan report unavailable)"
            echo
            echo "**Review:** the PR Policy workflow re-runs the security scan"
            echo "as a blocking check and posts an advisory AI docs-delta"
            echo "review comment. The AI review is advisory and reads"
            echo "attacker-influenced content — treat it as a hint, not a"
            echo "verdict. Merge only after inspecting any source the scan or"
            echo "review flags."
          } > /tmp/pr-body.md

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "${{ steps.commits.outputs.branch }}"
          gh pr create \
            --title "docs: weekly documentation refresh ($(date +%Y-%m-%d))" \
            --body-file /tmp/pr-body.md \
            --label "documentation,automated"
