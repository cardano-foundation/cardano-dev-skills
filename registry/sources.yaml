  description: Cardano Haskell package repository — Cabal index for Intersect packages that are not on Hackage (cardano-ledger, plutus-tx, cardano-api, …). Documents the repository stanza, index-state pinning, and haskell.nix inputMap.
  website: https://chap.intersectmbo.org/

