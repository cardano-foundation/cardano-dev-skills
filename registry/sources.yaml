  category: sdk
  priority: medium
  glob_patterns:
    - "**/*.mdx"
    - "**/*.md"
  description: Interface-description DSL for UTxO protocols plus toolchain (TxPipe) — authors declare a protocol's transactions in `.tx3` files; consumers generate typed clients (TypeScript, Rust, Go, Python) via the `trix` CLI. Ships TII/TIR interface artifacts and Cardano-specific language bindings.
  website: https://docs.txpipe.io/tx3

