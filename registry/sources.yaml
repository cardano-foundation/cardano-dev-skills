  glob_patterns:
    - readme.md
    - "docs/**/*.md"
    - "*.go"
    - "backend/**/*.go"
    - "plutusencoder/**/*.go"
    - "constants/**/*.go"
  description: Pure Go transaction builder - fluent tx construction, Plutus datum encoding, pluggable chain backends (use the /v2 module path)
  website: https://pkg.go.dev/github.com/Salvionied/apollo/v2

