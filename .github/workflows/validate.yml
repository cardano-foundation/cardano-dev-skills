name: Validate Skills & Sources

on:
  pull_request:
    paths:
      # docs/** is included for the Windows path-portability check: an
      # upstream doc named with a character Windows rejects breaks `git
      # clone` for every Windows user (issue #36).
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"
      # hooks/** runs on every user's machine at SessionStart, and had no gate
      # at all until its tests landed: PRs touching only hooks/ reported zero
      # checks.
      - "hooks/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".claude/skills"
      - ".agents/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "website/src/content/docs/getting-started.md"
      - "website/src/content/docs/how-it-works.md"
      - "website/src/content/docs/contributing/add-a-skill.md"
      - "website/src/content/docs/about/roadmap.md"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"
      # hooks/** runs on every user's machine at SessionStart, and had no gate
      # at all until its tests landed: PRs touching only hooks/ reported zero
      # checks.
      - "hooks/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".claude/skills"
      - ".agents/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "website/src/content/docs/getting-started.md"
      - "website/src/content/docs/how-it-works.md"
      - "website/src/content/docs/contributing/add-a-skill.md"
      - "website/src/content/docs/about/roadmap.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `--paths-only` promises to run with nothing installed, on whatever
      # python3 is already there, which is what the weekly refresh gates on.
      # Running it here on the oldest supported interpreter is what keeps that
      # a fact rather than an intention: the rest of the job is 3.12, where
      # 3.10-only syntax and a missing dependency both pass unnoticed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: "--paths-only runs on a bare interpreter"
        run: python scripts/validate.py --paths-only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills, sources, and Claude/Codex compatibility
        run: python scripts/validate.py

      # The JSON wire-output tests use the Python already set up above.
      - name: Test SessionStart hook
        run: ./hooks/test-check-docs.sh

  macos-hooks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test SessionStart with system Bash 3.2
        env:
          HOOK_BASH: /bin/bash
        run: /bin/bash ./hooks/test-check-docs.sh
