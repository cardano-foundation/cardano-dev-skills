name: Validate Skills & Sources

on:
  pull_request:
    paths:
      # docs/** is included for the Windows path-portability check: an
      # upstream doc named with a character Windows rejects breaks `git
      # clone` for every Windows user (issue #36).
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"
      # hooks/** runs on every user's machine at SessionStart, and had no gate
      # at all until its tests landed: PRs touching only hooks/ reported zero
      # checks.
      - "hooks/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".claude/skills"
      - ".agents/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "website/src/content/docs/getting-started.md"
      - "website/src/content/docs/how-it-works.md"
      - "website/src/content/docs/contributing/add-a-skill.md"
      - "website/src/content/docs/about/roadmap.md"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "registry/**"
      - "scripts/**"
      - "docs/**"
      # hooks/** runs on every user's machine at SessionStart, and had no gate
      # at all until its tests landed: PRs touching only hooks/ reported zero
      # checks.
      - "hooks/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".claude/skills"
      - ".agents/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "website/src/content/docs/getting-started.md"
      - "website/src/content/docs/how-it-works.md"
      - "website/src/content/docs/contributing/add-a-skill.md"
      - "website/src/content/docs/about/roadmap.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate skills, sources, and Claude/Codex compatibility
        run: python scripts/validate.py

      # Runs in the existing job on purpose — it needs no Python, no network and
      # under a second, so it does not warrant a fourth workflow.
      - name: Test SessionStart hook
        run: ./hooks/test-check-docs.sh
